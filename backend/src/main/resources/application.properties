# ==============================================================================
# Global Fintech Fest (GFF) - Spring Boot Application Configuration
# ==============================================================================

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api/v1

# Application Details
spring.application.name=gff-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ==============================================================================
# Database Configuration (PostgreSQL)
# Environment variable-based configuration - Credentials are NOT hardcoded.
# Override via environment variables: DB_URL, DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gff_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.jpa.open-in-view=false

# ==============================================================================
# Cross-Origin Resource Sharing (CORS) Configuration
# Allows Next.js frontend (default port 3000) to communicate with the backend
# ==============================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ==============================================================================
# AWS S3 Storage Configuration
# ==============================================================================
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.region=${AWS_REGION:ap-south-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:visiting-card-bkt}

# ==============================================================================
# Jackson / JSON Serialization
# ==============================================================================
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# ==============================================================================
# Daily OCR Report & Cron Automation (Runs at 9:30 PM / 21:30 IST)
# ==============================================================================
ocr.scheduler.cron=${OCR_SCHEDULER_CRON:0 30 21 * * ?}
ocr.scheduler.zone=${OCR_SCHEDULER_ZONE:Asia/Kolkata}
app.cron.daily-report=${DAILY_REPORT_CRON:0 30 21 * * *}
app.cron.zone=${DAILY_REPORT_ZONE:Asia/Kolkata}
app.mail.lead-email=${LEAD_EMAIL:jyoti.sonani@qualtechedge.com,ashutosh.vishwakarma@qualtechedge.com}
app.mail.from-email=${MAIL_FROM:noreply-gff@qualtechedge.com}

# ==============================================================================
# Spring Boot Mail Configuration (SMTP)
# ==============================================================================
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
