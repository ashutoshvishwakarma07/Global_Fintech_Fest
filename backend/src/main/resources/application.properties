# ==============================================================================
# Global Fintech Fest (GFF) - Spring Boot Application Configuration
# ==============================================================================

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api/v1

# Application Details
spring.application.name=gff-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ==============================================================================
# Database Configuration (PostgreSQL)
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://18.60.179.46:5432/visiting_card_db}
spring.datasource.username=${DB_USERNAME:visiting_card}
spring.datasource.password=${DB_PASSWORD:qualtechedge}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Optimized for Remote AWS PostgreSQL with Keepalive)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=GffHikariPool

# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.open-in-view=false

# ==============================================================================
# Cross-Origin Resource Sharing (CORS) Configuration
# Allows Next.js frontend (default port 3000) to communicate with the backend
# ==============================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.cors.allowed-origins:http://localhost:3000,http://18.60.179.46:3000}}
app.cors.allowed-origins=${cors.allowed-origins}

# ==============================================================================
# AWS S3 Storage Configuration
# ==============================================================================
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.region=${AWS_REGION:ap-south-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:visiting-card-bkt}

# Multipart & Payload Size Limits (allow high-resolution photos)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-swallow-size=20MB
server.tomcat.max-http-form-post-size=20MB

# ==============================================================================
# Jackson / JSON Serialization
# ==============================================================================
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# ==============================================================================
# Consolidated OCR Report Configuration
# ==============================================================================
# --- REPORT RECIPIENTS ---
app.mail.lead-email=${LEAD_EMAIL:}
app.mail.cc-email=${CC_EMAIL:}
app.mail.from-email=${MAIL_FROM:visiting.cardapp@qualtechedge.in}

# ==============================================================================
# IRIS OCR Configuration (Qualtech IRIS QA Server)
# ==============================================================================
iris.base-url=${IRIS_BASE_URL:https://iris-qa.qualtechedge.in/python}
iris.extract-endpoint=${IRIS_EXTRACT_ENDPOINT:/extract-document-public}
iris.application-id=${IRIS_APPLICATION_ID:42b9fd86-8f6d-403e-93a1-3a5856a7665e}
iris.password=${IRIS_PASSWORD:password1}
iris.entity-ref=${IRIS_ENTITY_REF:ENT-1001}

# ==============================================================================
# Spring Boot Mail Configuration (Gmail SMTP - Qualtech)
# ==============================================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.protocol=smtp
spring.mail.username=${SMTP_USERNAME:visiting.cardapp@qualtechedge.in}
spring.mail.password=${SMTP_PASSWORD:setodqatwfoijovo}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

