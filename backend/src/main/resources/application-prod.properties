# ==============================================================================
# Production / AWS EC2 Profile Configuration (application-prod.properties)
# Active on EC2 server: SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api/v1

# CORS Configuration for EC2 Production Frontend & Local Admin
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://18.60.179.46:3000,http://localhost:3000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://18.60.179.46:3000,http://localhost:3000}

# Production PostgreSQL Database on AWS EC2
spring.datasource.url=${DB_URL:jdbc:postgresql://18.60.179.46:5432/visiting_card_db}
spring.datasource.username=${DB_USERNAME:visiting_card}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# AWS S3 Settings
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.region=${AWS_REGION:ap-south-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:visiting-card-bkt}

# ==============================================================================
# IRIS OCR Configuration (Qualtech IRIS QA Server)
# ==============================================================================
iris.base-url=${IRIS_BASE_URL:https://iris-qa.qualtechedge.in/python}
iris.application-id=${IRIS_APPLICATION_ID:42b9fd86-8f6d-403e-93a1-3a5856a7665e}
iris.password=${IRIS_PASSWORD:password1}
iris.entity-ref=${IRIS_ENTITY_REF:ENT-1001}

